<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- iOS Safe Area 확장 및 Full Screen을 위한 Viewport 설정 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <!-- iOS PWA (홈 화면에 추가) 전용 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="카카오 보드게임" />
    
    <!-- iOS 사파리 상단바/노치 영역 기본 배경색 고정 (새로고침 시 검은색/흰색 깜빡임 차단) -->
    <meta name="theme-color" content="#FEE500" />
    
    <title>KGB</title>

    <style>
      /* React 구동 전 사파리/크롬 브라우저 엔진이 먼저 읽는 고정 레이아웃 CSS */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }

      /* 상단 헤더 정적 레이아웃 */
      .app-preload-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background-color: #FEE500;
        border-bottom: 1px solid rgba(252, 211, 77, 0.4);
        padding-top: env(safe-area-inset-top, 0px);
        z-index: 40;
        box-sizing: border-box;
      }

      /* 하단 네비게이션 정적 레이아웃 */
      .app-preload-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 56px;
        background-color: #ffffff;
        border-top: 1px solid #e2e8f0;
        padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
        z-index: 40;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <!-- ⭕ React 번들 파일(main.tsx)이 로드되기 전 브라우저가 먼저 띄워놓는 정적 헤더/하단바 -->
      <!-- 이 레이어 덕분에 새로고침 시 하얀 빈 화면 및 상하단 깜빡임이 100% 제거됩니다. -->
      <div class="app-preload-header"></div>
      <div class="app-preload-nav"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
