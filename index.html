<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- iOS Safe Area 확장 및 Full Screen Viewport 설정 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <!-- iOS PWA 전용 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="카카오 보드게임" />
    
    <title>카카오 보드게임 대여 서비스</title>

    <!-- React 마운트 전 다크모드 동기 적용 (새로고침 시 흰색/노란색 번쩍임 방지) -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('kakao_bg_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      /* 라이트모드 기본 본문/하단 배경 (흰색) */
      html, body {
        background-color: #ffffff;
      }

      /* 다크모드 기본 본문/상하단 배경 (#0f172a) */
      html.dark, html.dark body {
        background-color: #0f172a;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
