<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- iOS Safe Area 확장 및 Full Screen Viewport 설정 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <!-- iOS PWA 전용 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="카카오 보드게임" />
    
    <title>카카오 보드게임 대여 서비스</title>

    <!-- [FOUC 완벽 차단] HTML이 로드되는 순간 동기적으로 배경색과 dark 클래스를 박아버립니다 -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('kakao_bg_theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var docEl = document.documentElement;
          if (isDark) {
            docEl.classList.add('dark');
            docEl.style.backgroundColor = '#0f172a';
          } else {
            docEl.classList.remove('dark');
            docEl.style.backgroundColor = '#ffffff';
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* 최상위 루트 및 body 고정 */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      /* 배경색을 CSS 변수로 제어하여 딜레이 전무 처리 */
      html {
        background-color: #ffffff;
      }

      html.dark {
        background-color: #0f172a !important;
      }

      body {
        background-color: inherit;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
