<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- iOS Safe Area 확장 및 Full Screen을 위한 Viewport 설정 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <!-- iOS PWA 전용 메타 태그 (검은색 투명 겹침으로 인한 깜빡임 방지 설정) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="카카오 보드게임" />
    
    <title>카카오 보드게임 대여 서비스</title>

    <style>
      /* 최상위 뷰포트를 100dvh로 완전 고정하여 새로고침 시 화면 출렁임 및 검은 영역 노출 원천 차단 */
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden !important;
        position: fixed;
        left: 0;
        top: 0;
        -webkit-tap-highlight-color: transparent;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        background-color: #ffffff;
      }

      html.dark body {
        background-color: #0f172a;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
