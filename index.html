<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- iOS Safe Area 확장 및 Full Screen Viewport 설정 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <!-- [핵심 1] iOS 상/하단 브라우저 Safe Area 영역 전용 theme-color 메타 태그 -->
    <meta name="theme-color" id="theme-color-meta" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="카카오 보드게임" />
    
    <title>카카오 보드게임 대여 서비스</title>

    <!-- [핵심 2] 침하하 방식: React 로딩 전(0.001초) 브라우저가 화면을 그리는 순간 CSS 변수 및 Meta 태그 즉시 반영 -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kakao_bg_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          var meta = document.getElementById('theme-color-meta');
          
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.setProperty('--bg-main', '#0f172a');
            root.style.setProperty('--bg-header', '#0f172a');
            if (meta) meta.setAttribute('content', '#0f172a');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.setProperty('--bg-main', '#ffffff');
            root.style.setProperty('--bg-header', '#FEE500');
            if (meta) meta.setAttribute('content', '#FEE500');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* [핵심 3] CSS 변수를 활용하여 최상위 레이어부터 하단 Safe Area까지 여백 유격 완전 차단 */
      html {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--bg-main, #ffffff);
        -webkit-tap-highlight-color: transparent;
      }

      html.dark {
        background-color: #0f172a !important;
      }

      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: inherit;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
