<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <!-- [핵심 1] iOS 상/하단 브라우저 영역 전용 theme-color 메타 태그 추가 -->
    <meta name="theme-color" id="theme-color-meta" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="카카오 보드게임" />
    
    <title>카카오 보드게임 대여 서비스</title>

    <!-- [핵심 2] HTML 로드 0.001초 만에 theme-color 메타 태그 및 background를 동기 적용 -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('kakao_bg_theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var metaElem = document.getElementById('theme-color-meta');
          
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0f172a';
            if (metaElem) metaElem.setAttribute('content', '#0f172a');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.style.backgroundColor = '#ffffff';
            if (metaElem) metaElem.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: #ffffff;
      }

      html.dark {
        background-color: #0f172a !important;
      }

      body {
        background-color: inherit;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
